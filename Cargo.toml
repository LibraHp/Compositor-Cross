[package]
name = "compositor"
version = "0.1.0"
edition = "2021"
description = "Cross-platform layer compositor and image editor"
license = "MIT"
rust-version = "1.92"
publish = false

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
arboard = "3"
eframe = "0.35"
egui = "0.35"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
rayon = "1"
rawloader = "0.37"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2.12"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
